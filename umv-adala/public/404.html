<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UMV Adala</title>
    <!--
      GitHub Pages has no server-side rewrite for client-side routes, so a
      direct link or refresh on e.g. /Adla-Website/about 404s here. This
      redirects to the app root, encoding the real path into a query string
      that index.html's inline script decodes back via history.replaceState
      before React Router mounts. Standard fix: https://github.com/rafgraph/spa-github-pages
      pathSegmentsToKeep = 1 because the site is served under /Adla-Website/.
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
