<!DOCTYPE html>
<html>
<head>
<style>
.container { position: relative; width: 600px; height: 400px; }
.iframe { width: 100%; height: 100%; }
.floating-tag {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -100%);
  margin-top: -24px; /* Adjust for pin height */
  background: white;
  padding: 4px 10px;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  font-family: sans-serif;
  font-size: 13px;
  font-weight: bold;
  pointer-events: none;
}
.floating-tag::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-top: 6px solid white;
}
</style>
</head>
<body>
<div class="container">
  <iframe class="iframe" src="https://www.google.com/maps?q=25.508267,84.918096&z=15&output=embed" frameborder="0"></iframe>
  <div class="floating-tag">U.M.V. Adla High School</div>
</div>
</body>
</html>
