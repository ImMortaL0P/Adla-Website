<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Official website of Uccha Madhyamik Vidyalaya Adala — a Bihar Government school teaching Class 1 to 12 at Adla, Naubatpur, Patna." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Fonts — preconnect then load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>UMV Adala — Uccha Madhyamik Vidyalaya Adala</title>

    <!--
      Blocking theme script — runs BEFORE first paint.
      Without this, dark-mode users see a white flash on every load.
      A useEffect runs after first paint and cannot fix this.
      Wrapped in try/catch because localStorage throws in some privacy modes.
    -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('umv-theme') || 'light';
          var d = s === 'dark' || (s === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', d);
        } catch (e) {}
      })();
    </script>

    <!--
      Restores the real path after the 404.html redirect (see public/404.html).
      Must run before React Router mounts, so it's inline here rather than in
      a module — history.replaceState puts the real URL back before render.
    -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded.shift() + (decoded.length ? '?' + decoded.join('&') : '') + l.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
