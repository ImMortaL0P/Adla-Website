<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Official website of Uccha Madhyamik Vidyalaya Adala — a Bihar Government school teaching Class 1 to 12 at Adla, Naubatpur, Patna." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts — preconnect then load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>UMV Adala — Uccha Madhyamik Vidyalaya Adala</title>

    <!--
      Blocking theme script — runs BEFORE first paint.
      Without this, dark-mode users see a white flash on every load.
      A useEffect runs after first paint and cannot fix this.
      Wrapped in try/catch because localStorage throws in some privacy modes.
    -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('umv-theme') || 'system';
          var d = s === 'dark' || (s === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', d);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
