name: Mirror to Client Repo

on:
  push:
    branches:
      - main # Change to your default branch if different

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to client repository
        env:
          CLIENT_REPO_PAT: ${{ secrets.CLIENT_REPO_PAT }}
          # REPLACE the URL below with your client's actual GitHub repo details
          CLIENT_REPO_URL: "github.com/UMVAdla/UMV-Adla-Website.git"
        run: |
          git remote add client https://${CLIENT_REPO_PAT}@${CLIENT_REPO_URL}
          git push client main --force
